name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zod
          POSTGRES_PASSWORD: zod
          POSTGRES_DB: zod_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zod" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://zod:zod@localhost:5432/zod_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy
      - name: Tests (parsers, checks, migrations, API on PostgreSQL)
        run: pytest
      - name: Build the API image
        run: docker build -t zambia-open-data .
